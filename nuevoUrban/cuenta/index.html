<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:url("../imagenes/imagen2.jpg") center center / cover no-repeat fixed;
            font-family:'Lucida Sans','Lucida Sans Regular','Lucida Grande','Lucida Sans Unicode',Geneva,Verdana,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .contenedorPrincipal{
            width:1000px;
            height:600px;
            display:flex;
            background:rgba(82,124,184,.45);
            backdrop-filter:blur(12px);
            border-radius:20px;
            border:1px solid rgba(164,231,150,.699);
            box-shadow:0 0 20px rgba(0,0,0,.3);
            overflow:hidden;
        }

        /* Barra lateral */
        .barra{
            width:220px;
            height:100%;
            background:rgba(81,160,212,.55);
            padding:20px;
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        .botones{
            width:100%;
            height:55px;
            border:none;
            border-radius:10px;
            background:#3c78a9;
            color:white;
            cursor:pointer;
            transition:.2s;
        }

        .botones:hover{
            background:#58b57d;
            transform:scale(1.03);
        }

      
        .contenido{
            flex:1;
            padding:30px;
            color:white;
        }

        .btn-menu{
            background:#2980a2;
            border:none;
            margin-bottom:20px;
        }

        .btn-menu:hover{
            background:#58b57d;
        }

       
        .collapse-horizontal{
            transition:width .35s ease;
        }

        .fila{
        display:flex;
        gap:40px; 
        }

        .soloManual{
         
          margin-top:80px;
          height: 190px;
         
        }

        .caja{
            flex:1; /* Ambas ocupan el mismo ancho */
            height:100px;
            background:rgba(255,255,255,.15);
            border-radius:10px;
            border:1px solid rgba(255,255,255,.3);
            backdrop-filter:blur(10px);
            padding:20px;
            color:white;
        }
        .titulo{
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-weight: bold;
        }

        .texto{
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;

        }
        .botonesLinea {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            width: 80%;
            margin: 50px auto 0;
            justify-items: center;
        }

        .botonesInteractivos {
            width: 180px;
            height: 180px;
            object-fit: contain;
        }

        
    
    </style>

</head>

<body>

<div class="contenedorPrincipal">

    <!-- Barra lateral desplegable -->
    <div class="collapse collapse-horizontal show" id="menu">

        <div class="barra">

             <br>

           <img src="../imagenes/logoUrban4.png" alt="Logo" class="logo">

            <br>

            <button class="botones">Inicio</button>

            <button class="botones">Perfil</button>

            <button class="botones">Mapas</button>

            <button class="botones">Otras opciones</button>

        </div>

    </div>

   
    <div class="contenido">

        <button class="btn btn-menu text-white"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
            ☰ Menú
        </button>

        <h1 class="titulo">¡Bienvenido Usuario!</h1>

        <p class="texto">Que bueno verte otra vez.</p>

       
        <div class="botonesLinea">
        
            <h2>Nosotros</h2>
            <button type="button" onclick="miFuncion()" 
                    style="background: none; border: none; padding: 0; cursor: pointer;">
                <img src="../imagenes/imagenIdea.png" class="botonesInteractivos">
            </button>

            <button type="button" onclick="miFuncion()" 
                    style="background: none; border: none; padding: 0; cursor: pointer;">
                <img src="../imagenes/imagenInfo.png" class="botonesInteractivos">
            </button>

            <button type="button" onclick="miFuncion()" 
                    style="background: none; border: none; padding: 0; cursor: pointer;">
                <img src="../imagenes/imagenMundo.png" class="botonesInteractivos">
            </button>

             <h2>Manual</h2>
            <button type="button" onclick="miFuncion()" 
                    style="background: none; border: none; padding: 0; cursor: pointer;">
                <img src="../imagenes/imagenManual.png" class="botonesInteractivos">
            </button>

      
               </div> 

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
