<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Urbanaut | Cargando</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* =========================================
           FONDO
        ========================================= */

        body {
            min-height: 100vh;
            overflow: hidden;

            font-family: "Segoe UI", Arial, sans-serif;

            background-image: url("../imagenes/imagen2.jpg");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        /* CAPA SOBRE EL FONDO */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background: linear-gradient(
                135deg,
                rgba(0, 115, 255, .15),
                rgba(100, 70, 255, .10)
            );

            z-index: 0;
            pointer-events: none;
        }

        /* =========================================
           BURBUJAS
        ========================================= */

        .bubble {
            position: fixed;

            border-radius: 50%;

            background: rgba(255, 255, 255, .20);

            border: 1px solid rgba(255, 255, 255, .35);

            box-shadow: 0 10px 30px rgba(0, 80, 150, .10);

            animation: floating 7s ease-in-out infinite;

            z-index: 1;
        }

        .bubble.one {
            width: 90px;
            height: 90px;

            left: 6%;
            top: 12%;
        }

        .bubble.two {
            width: 35px;
            height: 35px;

            right: 12%;
            top: 18%;

            animation-delay: 1s;
        }

        .bubble.three {
            width: 120px;
            height: 120px;

            right: 4%;
            bottom: 7%;

            animation-delay: 2s;
        }

        .bubble.four {
            width: 45px;
            height: 45px;

            left: 10%;
            bottom: 10%;

            animation-delay: 3s;
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0) translateX(0);
            }

            50% {
                transform: translateY(-22px) translateX(10px);
            }
        }

        /* =========================================
           CONTENEDOR
        ========================================= */

        .contenedor {
            width: min(94%, 900px);
            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 15px;

            position: relative;
            z-index: 2;
        }

        /* =========================================
           TARJETA
        ========================================= */

        .card-urbanaut {
            width: 590px;
            max-width: 100%;

            padding: 32px 42px 35px;

            border-radius: 32px;

            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, .82),
                rgba(240, 249, 255, .65)
            );

            border: 1px solid rgba(255, 255, 255, .95);

            box-shadow:
                0 28px 75px rgba(0, 40, 90, .32),
                inset 0 1px 0 rgba(255, 255, 255, .95);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            text-align: center;

            animation: aparecer .8s ease;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(25px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================================
           LOGO
        ========================================= */

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 8px;
        }

        .logo img {
            width: 155px;
            max-height: 70px;

            object-fit: contain;

            display: block;

            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        /* =========================================
           TITULO
        ========================================= */

        .titulo {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 8px;
        }

        .titulo i {
            color: #238bff;
            font-size: 27px;

            animation: gpsIcon 1.8s ease-in-out infinite;
        }

        @keyframes gpsIcon {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        h1 {
            color: #123d69;

            font-size: 29px;

            font-weight: 750;

            margin: 0;
        }

        .subtitulo {
            color: #58738e;

            font-size: 14px;

            margin-top: 7px;
            margin-bottom: 18px;
        }

        /* =========================================
           MAPA
        ========================================= */

        .mapa {
            width: 100%;
            height: 275px;

            position: relative;

            overflow: hidden;

            border-radius: 25px;

            background: linear-gradient(
                135deg,
                #c3efff,
                #dce8ff
            );

            border: 2px solid rgba(255, 255, 255, .85);

            box-shadow: 0 8px 25px rgba(30, 100, 180, .15);

            margin-bottom: 22px;
        }

        /* CUADRICULA */

        .mapa::before {
            content: "";

            position: absolute;
            inset: 0;

            background-image:

                linear-gradient(
                    rgba(60, 130, 180, .13) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(60, 130, 180, .13) 1px,
                    transparent 1px
                );

            background-size: 35px 35px;
        }

        /* =========================================
           CALLES
        ========================================= */

        .calle {
            position: absolute;

            background: rgba(255, 255, 255, .90);

            border-radius: 20px;

            box-shadow: 0 2px 5px rgba(40, 100, 150, .10);

            z-index: 2;
        }

        .calle-h1 {
            width: 110%;
            height: 18px;

            top: 65px;
            left: -5%;

            transform: rotate(4deg);
        }

        .calle-h2 {
            width: 110%;
            height: 13px;

            top: 178px;
            left: -5%;

            transform: rotate(-5deg);
        }

        .calle-v1 {
            width: 15px;
            height: 120%;

            left: 105px;
            top: -20px;

            transform: rotate(9deg);
        }

        .calle-v2 {
            width: 19px;
            height: 120%;

            left: 290px;
            top: -25px;

            transform: rotate(-13deg);
        }

        .calle-v3 {
            width: 11px;
            height: 120%;

            right: 75px;
            top: -10px;

            transform: rotate(17deg);
        }

        /* =========================================
           AVENIDA
        ========================================= */

        .avenida {
            position: absolute;

            width: 130%;
            height: 30px;

            left: -15%;
            top: 125px;

            background: #8eaab9;

            border-top: 3px solid white;
            border-bottom: 3px solid white;

            transform: rotate(-8deg);

            z-index: 3;
        }

        .avenida::after {
            content: "";

            position: absolute;

            left: 0;
            top: 12px;

            width: 100%;
            height: 4px;

            background: repeating-linear-gradient(
                90deg,
                white 0px,
                white 35px,
                transparent 35px,
                transparent 65px
            );
        }

        /* =========================================
           EDIFICIOS
        ========================================= */

        .edificio {
            position: absolute;

            width: 27px;
            height: 27px;

            border-radius: 7px;

            background: linear-gradient(
                135deg,
                white,
                #b6ddff
            );

            border: 1px solid white;

            box-shadow: 0 4px 10px rgba(40, 100, 150, .15);

            z-index: 4;
        }

        .edificio::after {
            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 1px;

            background: #63d85f;

            top: 6px;
            left: 6px;

            box-shadow:
                10px 0 #238bff,
                0 10px #8d6cff,
                10px 10px #19b7c9;
        }

        .e1 {
            top: 20px;
            left: 30px;
        }

        .e2 {
            top: 25px;
            left: 160px;
        }

        .e3 {
            top: 30px;
            right: 35px;
        }

        .e4 {
            top: 92px;
            left: 45px;
        }

        .e5 {
            bottom: 25px;
            left: 150px;
        }

        .e6 {
            bottom: 20px;
            right: 35px;
        }

        /* =========================================
           RUTA ANIMADA
        ========================================= */

        .ruta {
            position: absolute;

            width: 430px;
            height: 190px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 7;

            pointer-events: none;
        }

        .ruta svg {
            width: 100%;
            height: 100%;
        }

        .ruta path {
            fill: none;

            stroke: #6b5cff;

            stroke-width: 7;

            stroke-linecap: round;
            stroke-linejoin: round;

            stroke-dasharray: 800;
            stroke-dashoffset: 800;

            filter: drop-shadow(
                0 3px 4px
                rgba(80, 60, 200, .25)
            );

            animation: dibujarRuta 3.5s ease-in-out infinite;
        }

        @keyframes dibujarRuta {

            0% {
                stroke-dashoffset: 800;
            }

            50% {
                stroke-dashoffset: 0;
            }

            100% {
                stroke-dashoffset: -800;
            }
        }

        /* =========================================
           GPS
        ========================================= */

        .gps {
            position: absolute;

            width: 25px;
            height: 25px;

            border-radius: 50%;

            background: #238bff;

            border: 4px solid white;

            box-shadow:
                0 0 0 7px rgba(35, 139, 255, .22),
                0 5px 15px rgba(20, 100, 200, .30);

            left: 24%;
            top: 61%;

            z-index: 10;

            animation: gpsMove 3.5s ease-in-out infinite;
        }

        @keyframes gpsMove {

            0% {
                left: 24%;
                top: 61%;
            }

            50% {
                left: 76%;
                top: 31%;
            }

            100% {
                left: 24%;
                top: 61%;
            }
        }

        /* =========================================
           ICONOS
        ========================================= */

        .map-icon {
            position: absolute;

            z-index: 8;

            font-size: 17px;
        }

        .parking {
            color: #238bff;

            right: 105px;
            top: 78px;
        }

        .restaurant {
            color: #ff7b54;

            left: 85px;
            bottom: 55px;
        }

        .gas {
            color: #8d6cff;

            right: 45px;
            bottom: 75px;
        }

        /* =========================================
           CARGA
        ========================================= */

        .carga {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 15px;
        }

        .circulo {
            width: 62px;
            height: 62px;

            border-radius: 50%;

            background: conic-gradient(
                #238bff 0deg,
                #6b5cff 0deg,
                #63d85f 0deg,
                rgba(255, 255, 255, .55) 0deg
            );

            display: flex;

            justify-content: center;
            align-items: center;

            position: relative;
        }

        .circulo::before {
            content: "";

            position: absolute;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            background: rgba(245, 253, 255, .97);
        }

        .numero {
            position: relative;

            z-index: 2;

            color: #246294;

            font-size: 14px;

            font-weight: 700;
        }

        .estado {
            text-align: left;
        }

        .estado strong {
            display: block;

            color: #246294;

            font-size: 15px;

            margin-bottom: 3px;
        }

        .estado span {
            color: #71879a;

            font-size: 12px;
        }

        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 650px) {

            .card-urbanaut {
                width: 94%;

                padding: 28px 22px 32px;
            }

            .mapa {
                height: 245px;
            }

            .ruta {
                width: 370px;
                height: 170px;
            }
        }

        @media (max-width: 430px) {

            .card-urbanaut {
                padding: 25px 17px 28px;
            }

            .logo img {
                width: 140px;
            }

            h1 {
                font-size: 23px;
            }

            .mapa {
                height: 220px;
            }

            .ruta {
                width: 320px;
                height: 150px;
            }
        }

    </style>

</head>

<body>

    <!-- BURBUJAS -->

    <div class="bubble one"></div>
    <div class="bubble two"></div>
    <div class="bubble three"></div>
    <div class="bubble four"></div>

    <main class="contenedor">

        <section class="card-urbanaut">

            <!-- LOGO -->

            <div class="logo">

                <img
                    src="../imagenes/logoNuevo2.png"
                    alt="Logo Urbanaut">

            </div>

            <!-- TITULO -->

            <div class="titulo">

                <i class="bi bi-geo-alt-fill"></i>

                <h1>Preparando tu viaje</h1>

            </div>

            <p class="subtitulo">
                Urbanaut está organizando todo para vos
            </p>

            <!-- MAPA -->

            <div class="mapa">

                <!-- CALLES -->

                <div class="calle calle-h1"></div>
                <div class="calle calle-h2"></div>
                <div class="calle calle-v1"></div>
                <div class="calle calle-v2"></div>
                <div class="calle calle-v3"></div>

                <!-- AVENIDA -->

                <div class="avenida"></div>

                <!-- EDIFICIOS -->

                <div class="edificio e1"></div>
                <div class="edificio e2"></div>
                <div class="edificio e3"></div>
                <div class="edificio e4"></div>
                <div class="edificio e5"></div>
                <div class="edificio e6"></div>

                <!-- ICONOS -->

                <i class="bi bi-p-square-fill map-icon parking"></i>

                <i class="bi bi-cup-hot-fill map-icon restaurant"></i>

                <i class="bi bi-fuel-pump-fill map-icon gas"></i>

                <!-- RUTA -->

                <div class="ruta">

                    <svg viewBox="0 0 430 190">

                        <path
                            d="
                            M 20 155
                            C 65 155, 75 110, 115 120
                            C 160 132, 165 165, 215 135
                            C 260 108, 255 55, 300 65
                            C 350 75, 350 30, 410 35
                            ">
                        </path>

                    </svg>

                </div>

                <!-- GPS -->

                <div class="gps"></div>

            </div>

            <!-- PROGRESO -->

            <div class="carga">

                <div class="circulo" id="circulo">

                    <span class="numero" id="numero">
                        0%
                    </span>

                </div>

                <div class="estado">

                    <strong id="tituloCarga">
                        Cargando Urbanaut...
                    </strong>

                    <span id="mensaje">
                        Preparando tu experiencia
                    </span>

                </div>

            </div>

        </section>

    </main>

    <script>

        let progreso = 0;

        const numero =
            document.getElementById("numero");

        const circulo =
            document.getElementById("circulo");

        const titulo =
            document.getElementById("tituloCarga");

        const mensaje =
            document.getElementById("mensaje");


        function actualizarMensaje() {

            if (progreso < 20) {

                titulo.textContent =
                    "Conectando...";

                mensaje.textContent =
                    "Preparando Urbanaut";

            }

            else if (progreso < 40) {

                titulo.textContent =
                    "Cargando datos...";

                mensaje.textContent =
                    "Organizando tu información";

            }

            else if (progreso < 60) {

                titulo.textContent =
                    "Buscando ubicación...";

                mensaje.textContent =
                    "Localizando las mejores opciones";

            }

            else if (progreso < 80) {

                titulo.textContent =
                    "Calculando recorrido...";

                mensaje.textContent =
                    "Preparando tu ruta";

            }

            else if (progreso < 95) {

                titulo.textContent =
                    "Casi listo...";

                mensaje.textContent =
                    "Terminando de preparar todo";

            }

            else {

                titulo.textContent =
                    "¡Todo listo!";

                mensaje.textContent =
                    "Entrando a Urbanaut 🚗";
            }
        }


        function actualizar() {

            numero.textContent =
                progreso + "%";


            const grados =
                progreso * 3.6;


            circulo.style.background =

                `conic-gradient(
                    #238bff 0deg,
                    #6b5cff ${grados * .55}deg,
                    #63d85f ${grados}deg,
                    rgba(255,255,255,.55)
                    ${grados}deg
                )`;


            actualizarMensaje();


            if (progreso < 100) {

                progreso++;

                setTimeout(
                    actualizar,
                    45
                );

            }

            else {

                setTimeout(

                    function () {

                        window.location.href =
                            "../inicio/index.html";

                    },

                    1000
                );
            }

        }


        setTimeout(
            actualizar,
            500
        );

    </script>

</body>

</html>
