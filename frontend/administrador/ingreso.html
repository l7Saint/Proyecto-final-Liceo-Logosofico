<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Urbanaut | Administrador</title>

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link
        rel="stylesheet"
        href="/assets/css/style.css">
    <link
        rel="stylesheet"
        href="/assets/css/ingreso.css">
  </head>

  <body>
    <main class="contenedor">
      <section class="card-admin">
        <!-- ICONO -->

        <div class="icono">
          <i class="bi bi-terminal"></i>
        </div>

        <!-- TÍTULO -->

        <h1>Panel de Administrador</h1>

        <p class="subtitulo">Acceso restringido</p>

        <!-- WARNING -->

        <div class="warning">
          <i class="bi bi-exclamation-triangle-fill"></i>

          <span>
            <strong>WARNING:</strong>
            Esta sección es exclusiva para administradores. No ingreses si no
            tenés autorización.
          </span>
        </div>

        <!-- FORMULARIO -->

        <form id="adminLoginForm" autocomplete="on">
          <!-- EMAIL -->

          <div class="campo">
            <label for="email"> Correo electrónico </label>

            <div class="input-contenedor">
              <i class="bi bi-envelope-fill"></i>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="admin@example.com"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <!-- CONTRASEÑA -->

          <div class="campo">
            <label for="password"> Contraseña </label>

            <div class="input-contenedor">
              <i class="bi bi-key-fill"></i>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresá tu contraseña"
                autocomplete="current-password"
                required
              />
            </div>
          </div>

          <!-- BOTÓN -->

          <button type="submit" class="btn-entrar">Ingresar al panel</button>
        </form>

        <!-- VOLVER -->

        <a href="../login/login.php" class="volver">
          <i class="bi bi-arrow-left"></i>
          Volver al inicio de sesión
        </a>

        <!-- ESTADO -->

        <div class="estado">SISTEMA <span>●</span> ACTIVO</div>
      </section>
    </main>

    <script type="module">
      import UrbanautClient from '/urbanaut-js-client/src/urbanaut.js';

      // Backend origin. The admin section is served statically, so we hard-code
      // the URL the same way the rest of the admin panel does.
      const BACKEND_URL = 'http://127.0.0.1:30000';

      const LEGACY_TOKEN_KEY = 'urbanaut_token';

      const api = new UrbanautClient({ baseUrl: BACKEND_URL + '/api' });

      const form = document.getElementById('adminLoginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = emailInput.value.trim();
        const contrasena = passwordInput.value.trim();

        if (!email || !contrasena) {
          alert('Por favor, completá el correo electrónico y la contraseña.');
          return;
        }

        try {
          // POST /api/usuario/login — the client persists the token automatically.
          const data = await api.usuario.login({ email, contrasena });

          const usuario = data?.usuario;
          if (!usuario || Number(usuario.es_admin) !== 1) {
            // Not an admin: discard the session so a normal user can't hold
            // onto admin-panel state.
            try { await api.usuario.logout(); } catch { /* ignore */ }
            api.clearSession();
            localStorage.removeItem(LEGACY_TOKEN_KEY);
            alert('Esta cuenta no tiene permisos de administrador.');
            return;
          }

          // Mirror the client token to the legacy key so pages that still read
          // `urbanaut_token` (admin panel, map) keep working without changes.
          localStorage.setItem(LEGACY_TOKEN_KEY, data.token);

          window.location.href = '../administrador/index.html';
        } catch (err) {
          console.error('Admin login error:', err);

          if (err?.name === 'ValidationError') {
            alert('Completá todos los campos.');
          } else if (err?.name === 'NetworkError') {
            alert('No se pudo conectar con el servidor.');
          } else if (err?.status === 401) {
            alert('Email o contraseña incorrectos.');
          } else if (err?.status === 400) {
            alert('Datos incorrectos.');
          } else if (err?.status === 500) {
            alert('Error interno del servidor.');
          } else {
            alert('Ocurrió un error inesperado.');
          }
        }
      });
    </script>
  </body>
</html>
