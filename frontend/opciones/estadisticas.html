<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Urbanaut | Estadísticas</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <link
        rel="stylesheet"
        href="/assets/css/style.css">

    <link
        rel="stylesheet"
        href="/assets/css/estadisticas.css">

</head>


<body>

    <main class="contenedor">

        <section class="card-urbanaut">


            <!-- TÍTULO -->

            <div class="titulo">

                <i class="bi bi-bar-chart-line-fill"></i>

                <h1>
                    Mis Estadísticas
                </h1>

            </div>


            <p class="subtitulo">

                Revisá tu actividad y uso de estacionamientos.

            </p>


            <!-- ESTADÍSTICAS -->

            <div class="estadisticas">

                <div class="estadistica-card">

                    <i class="bi bi-car-front-fill"></i>

                    <span class="numero">
                        6
                    </span>

                    <span class="texto">
                        Veces que estacionó en la semana
                    </span>

                </div>


                <div class="estadistica-card">

                    <i class="bi bi-calendar-check-fill"></i>

                    <span class="numero">
                        24
                    </span>

                    <span class="texto">
                        Veces que estacionó en el mes
                    </span>

                </div>


                <div class="estadistica-card">

                    <i class="bi bi-clock-history"></i>

                    <span class="numero">
                        18 h
                    </span>

                    <span class="texto">
                        Horas estacionado
                    </span>

                </div>

            </div>


            <!-- GRÁFICO -->

            <div class="grafico-contenedor">

                <h2>
                    Actividad de estacionamiento
                </h2>

                <div class="grafico">

                    <canvas
                        id="graficoEstacionamiento">
                    </canvas>

                </div>

            </div>


            <!-- INFORMACIÓN EXTRA -->

            <div class="info-extra">

                <div class="info-card">

                    <i class="bi bi-geo-alt-fill"></i>

                    <div>

                        <h3>
                            Zona más utilizada
                        </h3>

                        <p>
                            Centro de Montevideo
                        </p>

                    </div>

                </div>


                <div class="info-card">

                    <i class="bi bi-stopwatch-fill"></i>

                    <div>

                        <h3>
                            Tiempo promedio
                        </h3>

                        <p>
                            45 minutos por estacionamiento
                        </p>

                    </div>

                </div>

            </div>


            <!-- BOTÓN -->

            <div class="botones">

                <a
                    href="../inicio/index.html"
                    class="volver">

                    <i class="bi bi-house"></i>

                    Volver a Inicio

                </a>

            </div>


        </section>

    </main>


    <!-- CHART.JS -->

    <script>

        const ctx =
            document.getElementById(
                "graficoEstacionamiento"
            );


        new Chart(ctx, {

            type: "bar",

            data: {

                labels: [

                    "Lun",
                    "Mar",
                    "Mié",
                    "Jue",
                    "Vie",
                    "Sáb"

                ],

                datasets: [

                    {

                        label:
                            "Horas estacionadas",

                        data: [

                            2,
                            4,
                            1,
                            3,
                            5,
                            2

                        ],

                        backgroundColor:
                            "rgba(35, 139, 255, 0.65)",

                        borderColor:
                            "#238bff",

                        borderWidth: 2,

                        borderRadius: 10

                    }

                ]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                plugins: {

                    legend: {

                        display: false

                    }

                },

                scales: {

                    y: {

                        beginAtZero: true,

                        ticks: {

                            stepSize: 1

                        }

                    }

                }

            }

        });

    </script>

</body>

</html>
