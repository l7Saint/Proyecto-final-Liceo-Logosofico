<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url("../imagenes/imagen2.jpg") center center / cover no-repeat fixed;

            font-family: 'Lucida Sans', 'Lucida Sans Regular',
                         'Lucida Grande', 'Lucida Sans Unicode',
                         Geneva, Verdana, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }


 

        .contenedorPrincipal {
            width: 55%;
            min-width: 500px;
            max-width: 750px;

            min-height: 600px;

            background: rgba(82, 124, 184, .45);
            backdrop-filter: blur(12px);

            border-radius: 20px;

            border: 1px solid rgba(164, 231, 150, .699);

            box-shadow: 0 0 20px rgba(0, 0, 0, .3);

            padding: 35px;

            color: rgb(8, 82, 92);
        }


   

        .contenido {
            width: 100%;
            height: 100%;
        }


     

        .titulo {
            text-align: center;

            font-weight: bold;

            margin-bottom: 10px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular',
                         'Lucida Grande', 'Lucida Sans Unicode',
                         Geneva, Verdana, sans-serif;

            font-weight: bold;
            margin-bottom: 25px;
            color: white;
        }

        .subtitulo {
            text-align: center;

            font-size: 16px;

            margin-bottom: 30px;

            color: #d9f7ff;
        }


 

        #cajaHorarios {
            width: 100%;
        }


        .dia {
            background: rgba(119, 172, 216, .75);

            border-radius: 12px;

            margin-bottom: 12px;

            padding: 12px 18px;

            transition: .2s;

            border: 1px solid rgba(255, 255, 255, .25);
        }

        .dia:hover {
            background: rgba(139, 194, 232, .85);

            transform: translateY(-2px);
        }


 

        .dia-principal {
            display: flex;

            align-items: center;

            justify-content: space-between;

            cursor: pointer;
        }

        .dias {
            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-left: 8px;
        }




        .checkbox-dia {
            width: 20px;
            height: 20px;

            cursor: pointer;

            accent-color: #58b57d;
            
             
        }

     

        ul {
            list-style: none;

            padding: 10px 0 0 0;

            margin: 5px 0 0 0;

            border-top: 1px solid rgba(255,255,255,.25);
        }

        .li-hora {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            margin: 5px 0;
            background: rgba(255,255,255,.15);
            border-radius: 8px;
            transition: .2s;
        }

        .li-hora:hover {
            background: rgba(255,255,255,.25);
        }

        .li-hora label {
            font-size: 14px;

            cursor: pointer;
        }

        .li-hora input {
            width: 18px;
            height: 18px;

            cursor: pointer;

            accent-color: #66c98d;
        }


       

        .btn-menu {
            width: 45%;

            height: 42px;

            border: none;

            border-radius: 10px;

            background: #1e7489;

            color: rgb(172, 234, 206);

            cursor: pointer;

            transition: .2s;

            margin: 25px auto 0;

            display: block;

            font-weight: bold;
        }

        .btn-menu:hover {
            background: #58b57d;

            transform: scale(1.03);
        }


        @media (max-width: 800px) {

            .contenedorPrincipal {
                width: 90%;

                min-width: 0;

                padding: 25px;
            }

            .titulo {
                font-size: 28px;
            }

            .btn-menu {
                width: 70%;
            }
        }

    </style>

</head>


<body>

    <div class="contenedorPrincipal">

        <div class="contenido">

            <form action="horarios.php" method="POST">

                <h1 class="titulo">Ingresa tus Horarios </h1>

                <p class="subtitulo">Seleccioná los días y horarios en los que necesitás estacionamiento.</p>


                <div id="cajaHorarios">
                    <div id="contenedorLunes" class="dia">
                        <div class="dia-principal">
                            <div>
                                <input
                                    type="checkbox"
                                    id="Lunes"
                                    name="dias[]"
                                    value="Lunes"
                                    class="checkbox-dia"
                                    onclick="despliegaHorarios('ulLunes')"
                                >

                                <label for="Lunes" class="dias">
                                    Lunes
                                </label>
                            </div>

                        </div>

                    </div>


                 
                    <div id="contenedorMartes" class="dia">

                        <div class="dia-principal">

                            <div>
                                <input
                                    type="checkbox"
                                    id="Martes"
                                    name="dias[]"
                                    value="Martes"
                                    class="checkbox-dia"
                                    onclick="despliegaHorarios('ulMartes')"
                                >

                                <label for="Martes" class="dias">
                                    Martes
                                </label>
                            </div>

                        </div>

                    </div>


                  
                    <div id="contenedorMiercoles" class="dia">

                        <div class="dia-principal">

                            <div>
                                <input
                                    type="checkbox"
                                    id="Miercoles"
                                    name="dias[]"
                                    value="Miercoles"
                                    class="checkbox-dia"
                                    onclick="despliegaHorarios('ulMiercoles')"
                                >

                                <label for="Miercoles" class="dias">
                                    Miércoles
                                </label>
                            </div>

                        </div>

                    </div>


        
                    <div id="contenedorJueves" class="dia">

                        <div class="dia-principal">

                            <div>
                                <input
                                    type="checkbox"
                                    id="Jueves"
                                    name="dias[]"
                                    value="Jueves"
                                    class="checkbox-dia"
                                    onclick="despliegaHorarios('ulJueves')"
                                >

                                <label for="Jueves" class="dias">
                                    Jueves
                                </label>
                            </div>

                        </div>

                    </div>


                    <div id="contenedorViernes" class="dia">

                        <div class="dia-principal">

                            <div>
                                <input
                                    type="checkbox"
                                    id="Viernes"
                                    name="dias[]"
                                    value="Viernes"
                                    class="checkbox-dia"
                                    onclick="despliegaHorarios('ulViernes')"
                                >

                                <label for="Viernes" class="dias">
                                    Viernes
                                </label>
                            </div>

                        </div>

                    </div>

                </div>
                <button type="button" class="btn-menu" onclick="window.location.href='auto.html'">Continuar</button>
            </form>

        </div>

    </div>


    <script>

        var horariosCreados = false;

        const DIAS = [
            "Lunes",
            "Martes",
            "Miercoles",
            "Jueves",
            "Viernes"
        ];


        const HORAS = [
            "8:00 - 8:40",
            "8:40 - 9:20",
            "9:25 - 10:05",
            "10:15 - 10:55",
            "11:00 - 11:40",
            "11:40 - 12:20",
            "11:45 - 12:25",
            "12:25 - 13:05",
            "13:05 - 13:45",
            "13:50 - 14:30",
            "14:30 - 15:10",
            "15:15 - 15:55",
            "15:55 - 16:35"
        ];


        function generarLiHorarioHora(dia, nhora) {

            var liHora = document.createElement("li");

            liHora.innerHTML = `
                <label for="${dia}${nhora}">
                    ${HORAS[nhora]}
                </label>

                <input
                    type="checkbox"
                    id="${dia}${nhora}"
                    name="horarios${dia}[]"
                    value="${nhora}"
                >
            `;

            liHora.id = "li" + dia + nhora;

            liHora.classList.add("li-hora");

            return liHora;
        }


        function generarUlHorarioDia(dia) {

            var ulDia = document.createElement("ul");

            for (
                var nhora = 0;
                nhora < HORAS.length;
                nhora++
            ) {

                var liHora =
                    generarLiHorarioHora(dia, nhora);

                ulDia.appendChild(liHora);
            }

            ulDia.id = "ul" + dia;

            return ulDia;
        }


        function generarHorarios() {

            for (
                var ndia = 0;
                ndia < DIAS.length;
                ndia++
            ) {

                var contenedorDia =
                    document.getElementById(
                        "contenedor" + DIAS[ndia]
                    );

                var ulDia =
                    generarUlHorarioDia(DIAS[ndia]);

                ulDia.hidden = true;

                contenedorDia.appendChild(ulDia);
            }
        }


        function despliegaHorarios(idUl) {

            if (!horariosCreados) {

                generarHorarios();

                horariosCreados = true;
            }

            var ul =
                document.getElementById(idUl);

            if (ul.hidden) {

                ul.hidden = false;

            } else {

                ul.hidden = true;
            }
        }

    </script>

</body>

</html>
