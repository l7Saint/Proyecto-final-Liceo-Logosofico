<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Urbanaut | Administrador</title>

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link
        rel="stylesheet"
        href="/assets/css/style.css">
    <link
        rel="stylesheet"
        href="/assets/css/ingreso.css">
  </head>

  <body>
    <main class="contenedor">
      <section class="card-admin">
        <!-- ICONO -->

        <div class="icono">
          <i class="bi bi-terminal"></i>
        </div>

        <!-- TÍTULO -->

        <h1>Panel de Administrador</h1>

        <p class="subtitulo">Acceso restringido</p>

        <!-- WARNING -->

        <div class="warning">
          <i class="bi bi-exclamation-triangle-fill"></i>

          <span>
            <strong>WARNING:</strong>
            Esta sección es exclusiva para administradores. No ingreses si no
            tenés autorización.
          </span>
        </div>

        <!-- FORMULARIO -->

        <form onsubmit="entrarAdministrador(event)">
          <!-- NOMBRE -->

          <div class="campo">
            <label for="admin"> Nombre de administrador </label>

            <div class="input-contenedor">
              <i class="bi bi-person-fill"></i>

              <input
                type="text"
                id="admin"
                placeholder="Ingresá tu usuario"
                required
              />
            </div>
          </div>

          <!-- CONTRASEÑA -->

          <div class="campo">
            <label for="password"> Contraseña </label>

            <div class="input-contenedor">
              <i class="bi bi-key-fill"></i>

              <input
                type="password"
                id="password"
                placeholder="Ingresá tu contraseña"
                required
              />
            </div>
          </div>

          <!-- BOTÓN -->

          <button type="submit" class="btn-entrar">Ingresar al panel</button>
        </form>

        <!-- VOLVER -->

        <a href="../login/login.php" class="volver">
          <i class="bi bi-arrow-left"></i>
          Volver al inicio de sesión
        </a>

        <!-- ESTADO -->

        <div class="estado">SISTEMA <span>●</span> ACTIVO</div>
      </section>
    </main>

    <script>
      function entrarAdministrador(event) {
        event.preventDefault();

        const usuario = document.getElementById("admin").value;

        const password = document.getElementById("password").value;

        /*
                POR AHORA solamente comprobamos
                que haya datos.

                Más adelante esto se puede conectar
                con PHP y una base de datos.
            */

        if (usuario !== "" && password !== "") {
          window.location.href = "../adminitrador/index.html";
        }
      }
    </script>
  </body>
</html>
